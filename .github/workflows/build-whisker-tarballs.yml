name: build-whisker-tarballs

# Triggered on `v*-whisker.*` tag push. Produces three sets of
# release artefacts; the tag name without leading `v` becomes the
# `<version>` segment in each.
#
# 1. **Legacy tarballs** (`whisker-lynx-{android,ios}-<ver>.tar.gz`)
#    that the current `whisker-build::lynx::ensure_lynx_*` fetcher
#    downloads. Kept while the consumer migrates to Maven / SwiftPM.
#
# 2. **Maven repo** of the four Android AARs published to the
#    `gh-pages` branch under `/maven/`, served at
#    `https://whiskerrs.github.io/lynx/maven/`. Coordinates are
#    `rs.whisker:lynx-{android,base-android,trace-android,
#    service-api-android}:<ver>`.
#
# 3. **SwiftPM-ready xcframework zips** for the four iOS
#    xcframeworks (`Lynx`, `LynxBase`, `LynxServiceAPI`, `PrimJS`),
#    each with the SwiftPM checksum that `binaryTarget(url:,
#    checksum:)` consumers paste verbatim.
#
# Companion: `whiskerrs/whisker` repo pins `LYNX_VERSION` /
# `LYNX_FORK_TAG` / `LYNX_*_SHA256` constants in
# `crates/whisker-build/src/lynx.rs`. After a successful release,
# the SHA-256 sidecars uploaded here go into those constants.

on:
  push:
    tags:
      - 'v*-whisker.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Override tag (omit to use HEAD as v0.0.0-whisker.dev)'
        required: false
        default: ''

permissions:
  contents: write   # for softprops/action-gh-release + gh-pages push

jobs:
  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Download Source
        uses: actions/checkout@v4
        with:
          path: lynx
          submodules: recursive

      - name: Set up JDK 11 (Lynx gradle 6.7.1)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Python Setup (for hab + py_deps)
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Lynx Python deps + run habitat sync
        uses: ./lynx/.github/actions/common-deps
        with:
          cache-backend: github

      - name: Install Android NDK 21.1.6352462 + platforms/build-tools
        # Lynx pins ndk 21.1.6352462 inside `gradle.properties` and
        # reads it via `ndk.dir = $ANDROID_HOME/ndk/<version>`, so
        # we install into that canonical location rather than relying
        # on the runner's pre-installed NDKs (which don't include r21).
        # Lynx ships its own installer that uses the sdkmanager
        # buildtools the prior step's `tools/hab sync . -f --target
        # dev` already staged.
        working-directory: lynx
        run: |
          set -e
          tools/hab sync . -f --target dev --target-only
          python3 tools/android_tools/prepare_android_build.py

      - name: Build Android AARs
        working-directory: lynx
        # NDK env vars point at the sdkmanager-installed NDK rather
        # than the pre-installed-but-stale GHA runner one. Lynx's
        # build expects exactly 21.1.6352462; mismatching paths cause
        # `local.properties`'s ndk.dir to resolve to an empty dir
        # ("Location specified by ndk.dir did not contain a valid NDK").
        run: |
          set -e
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/21.1.6352462"
          export ANDROID_NDK="$ANDROID_NDK_HOME"
          source tools/envsetup.sh
          cd platform/android
          ./gradlew --no-daemon \
            :LynxBase:assembleNoasanRelease \
            :LynxTrace:assembleNoasanRelease \
            :LynxAndroid:assembleNoasanRelease \
            :ServiceAPI:assembleNoasanRelease

      - name: Resolve release version
        id: ver
        env:
          # `github.event.inputs.tag` is the universally-available form
          # — `inputs.*` is only valid on workflow_dispatch / call /
          # run events, so referencing it on a tag push fails workflow
          # validation. `event.inputs` evaluates to an empty string on
          # push events and we cope with that below.
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="${INPUT_TAG#v}"
            if [ -z "$VER" ]; then VER="0.0.0-whisker.dev"; fi
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Stage tarball contents
        working-directory: lynx
        run: |
          set -e
          VER="${{ steps.ver.outputs.version }}"
          STAGE="$GITHUB_WORKSPACE/whisker-lynx-android-$VER"
          mkdir -p "$STAGE/unpacked/jni" "$STAGE/headers"

          declare -A AAR_PAIRS=(
            [base/platform/android/build/outputs/aar/LynxBase-noasan-release.aar]=LynxBase.aar
            [base/trace/android/build/outputs/aar/LynxTrace-noasan-release.aar]=LynxTrace.aar
            [platform/android/lynx_android/build/outputs/aar/LynxAndroid-noasan-release.aar]=LynxAndroid.aar
            [platform/android/service_api/build/outputs/aar/ServiceAPI-noasan-release.aar]=ServiceAPI.aar
          )
          for SRC in "${!AAR_PAIRS[@]}"; do
            DST="${AAR_PAIRS[$SRC]}"
            if [ ! -f "$SRC" ]; then
              echo "::error::AAR not produced: $SRC"; exit 1
            fi
            cp "$SRC" "$STAGE/$DST"
            # Extract jni/<abi>/*.so from the AAR (AAR is a zip).
            unzip -oq "$SRC" 'jni/*' -d "$STAGE/unpacked/" || true
          done

          # C++ headers used by whisker-driver-sys/build.rs's cc-rs
          # compilation. The bridge code includes paths like
          # `"core/shell/lynx_shell.h"` and is compiled with
          # `-I <staged>/Lynx`, so the file must end up at
          # `<staged>/Lynx/core/shell/lynx_shell.h`. That is — the
          # `core/` (or `base/`, `service_api/`) directory name is
          # preserved INSIDE the namespace dir. Tarring from `find
          # "$src" …` (not from inside $src) keeps the wrapping
          # component.
          stage_headers() {
            local src="$1"; local dst="$STAGE/headers/$2"
            mkdir -p "$dst"
            find "$src" -name '*.h' -print0 | \
              tar -cf - --null --files-from=- | \
              (cd "$dst" && tar -xf -)
          }
          stage_headers core            Lynx
          stage_headers base            LynxBase
          stage_headers service_api     LynxServiceAPI
          # Lynx code does `#include "third_party/rapidjson/document.h"`
          # etc. from within `core/...` headers. We stage third_party
          # under the Lynx namespace so `-I <staged>/Lynx` covers
          # those resolves. Mirrors the iOS xtask staging layout
          # (CocoaPods source pods bundle third_party inside the pod).
          # PrimJS itself is excluded — it has its own namespace.
          stage_third_party() {
            local dst="$STAGE/headers/Lynx/third_party"
            mkdir -p "$dst"
            find third_party -name '*.h' -not -path 'third_party/primjs/*' -print0 | \
              tar -cf - --null --files-from=- | \
              (cd "$STAGE/headers/Lynx" && tar -xf -)
          }
          stage_third_party
          # PrimJS lives under third_party/primjs/. The bridge
          # references `<staged>/PrimJS/src/...` directly, so strip
          # the `third_party/primjs/` wrapping but keep `src/` etc.
          if [ -d third_party/primjs ]; then
            mkdir -p "$STAGE/headers/PrimJS"
            (cd third_party/primjs && find . -name '*.h' -print0) | \
              tar -cf - --null --files-from=- -C third_party/primjs | \
              (cd "$STAGE/headers/PrimJS" && tar -xf -)
          fi

      - name: Pack tarball + checksum
        run: |
          set -e
          VER="${{ steps.ver.outputs.version }}"
          NAME="whisker-lynx-android-$VER.tar.gz"
          tar czf "$NAME" -C "$GITHUB_WORKSPACE" "whisker-lynx-android-$VER"
          sha256sum "$NAME" | tee "$NAME.sha256"
          ls -lh "$NAME"

      - name: Upload artifact (workflow_dispatch)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: whisker-lynx-android
          path: |
            whisker-lynx-android-*.tar.gz
            whisker-lynx-android-*.tar.gz.sha256

      - name: Upload to release (tag push)
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            whisker-lynx-android-*.tar.gz
            whisker-lynx-android-*.tar.gz.sha256

      - name: Stage Maven repo layout
        # See .whisker/android/stage-maven.sh — produces a Maven 2
        # repository under $REPO_DIR with the four AARs under the
        # `rs.whisker` group. Coordinates land as `rs.whisker:
        # lynx-android`, `rs.whisker:lynx-base-android`, etc., which
        # Whisker consumer `build.gradle.kts` reads via:
        #
        #     implementation("rs.whisker:lynx-android:<version>")
        #
        # The script lives inside the lynx tree (which actions/checkout
        # placed at `lynx/` via `path: lynx` on the checkout step), so
        # invoke it with the prefix from workspace root. LYNX_ROOT is
        # `lynx` so the script's internal `cd "$LYNX_ROOT"` still
        # resolves the AAR paths off the workspace root.
        run: lynx/.whisker/android/stage-maven.sh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          REPO_DIR: ${{ github.workspace }}/maven-out
          LYNX_ROOT: lynx

      - name: Upload Maven layout (workflow_dispatch)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: maven-repo
          path: maven-out/**

      - name: Publish Maven repo to gh-pages (tag push)
        # Serves the Maven 2 layout at
        # https://whiskerrs.github.io/lynx/maven/  once GitHub
        # Pages is enabled on the gh-pages branch (one-time repo
        # setting). `keep_files: true` preserves prior tags so the
        # index keeps growing rather than being clobbered.
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: maven-out
          destination_dir: maven
          keep_files: true
          commit_message: "publish Maven artifacts for ${{ steps.ver.outputs.version }}"

  ios:
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        # macos-14 runners ship multiple Xcode installs. Need 16+
        # because xcodegen (and our Whisker pbxproj template) produce
        # `objectVersion = 77`, which Xcode 15.x rejects with "future
        # Xcode project file format". Pick the highest 16.x present
        # so the choice doesn't drift as the runner image updates.
        run: |
          set -e
          CHOSEN=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort | tail -1)
          if [ -z "$CHOSEN" ]; then
            echo "::error::no Xcode 16.x found in /Applications. Available:"
            ls -d /Applications/Xcode*.app 2>&1 || true
            exit 1
          fi
          echo "Selecting $CHOSEN"
          sudo xcode-select -s "$CHOSEN"
          xcodebuild -version

      - name: Install xcodegen + CocoaPods
        run: |
          set -e
          brew install xcodegen
          # 1.16.2 fixes a bug where `:path` pods' `private_header_files`
          # entries with a path containing a top-level dir named `build/`
          # (e.g. `build/build_config.h` in fork's LynxBase.podspec) weren't
          # being copied to the framework's PrivateHeaders, causing
          # `'build/build_config.h' file not found` at compile time. Local
          # 1.16.2 build succeeds; 1.15.2 reproduces the CI failure.
          gem install cocoapods -v 1.16.2 --no-document

      - name: Python Setup (for tools/hab sync)
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python deps (PyYAML etc.)
        # `tools/hab sync` runs codegen actions that import PyYAML
        # (`generate_feature_count.py`, `generate_performance_entry.py`).
        # Without these the sync errors out with `ModuleNotFoundError:
        # No module named 'yaml'`.
        run: python3 -m pip install -r tools/vpython_tools/requirements.txt --break-system-packages --retries 10 --timeout 60

      - name: Generate CSS property headers (run codegen scripts)
        # `core/renderer/css/css_property_id.h` (and ~15 other
        # gitignored generated headers in that dir) are produced by
        # `tools/css_generator/css_parser_generator.py` + friends, which
        # the GN build invokes via `exec_script` from
        # `core/renderer/css/BUILD.gn`. CocoaPods doesn't use GN, so
        # these never get generated through the iOS build chain.
        # Upstream Lynx ships them pre-generated in the release zip;
        # the fork tree's pod source ships only the generator scripts,
        # so we run them here.
        working-directory: tools/css_generator
        run: |
          python3 css_parser_generator.py
          python3 generate_layout_property.py \
            css_defines \
            ../../core/renderer/css/layout_property.h \
            css_defines_sha256.txt

      - name: Generate lynx_config headers (run gen_config codegen)
        # `core/template_bundle/template_codec/binary_decoder/lynx_config_auto_gen.{h,cc}`
        # and friends are produced by `tools/config/gen_config.py`.
        # Same story as the CSS generator — GN invokes it, CocoaPods
        # doesn't, so we run it explicitly here.
        run: python3 tools/config/check_and_run.py

      - name: Sync third_party deps (habitat)
        # iOS xcframework builds reference `third_party/modp_b64/*`,
        # `third_party/rapidjson/*`, etc.; those subtrees are pulled in
        # via `tools/hab sync`, not committed to the repo, so a fresh
        # `actions/checkout` lacks them and the compile fails on the
        # first `#include "third_party/..."` it hits.
        #
        # The Android job uses `--target dev --target-only` (via
        # `.github/actions/common-deps`), but that filter excludes
        # generic deps like modp_b64 that iOS still needs at compile
        # time. Sync without the `--target` filter to fetch every
        # entry in `dependencies/DEPS` that the current platform
        # satisfies the `condition` predicate for.
        #
        # `common-deps` is the Android job's compositie action but it
        # hardcodes `lynx/tools/ci/...` paths — Android checks out the
        # repo under `${{ workspace }}/lynx/`, whereas this iOS job
        # checks out at the workspace root, so the composite would
        # fail. Invoke hab directly; the first build pays the network
        # fetch (~30s), later runs can add a manual actions/cache
        # step if the fetch becomes expensive.
        #
        # Retry: `hab sync` hits services.gradle.org and lynx-family
        # /buildtools GitHub Releases over multi-part HTTPS, and macOS
        # runners have been observed to SSL-timeout on these during
        # release pushes (an `SSLWantReadError` after a successful
        # partial download). The fetcher is not idempotent inside a
        # single invocation, so wrap the whole call in a 5-attempt
        # backoff to soak up brief CDN flakiness.
        run: |
          for attempt in 1 2 3 4 5; do
            if tools/hab sync . -f; then
              echo "hab sync succeeded on attempt $attempt"
              exit 0
            fi
            backoff=$((attempt * 15))
            echo "hab sync attempt $attempt failed — sleeping ${backoff}s before retry"
            sleep $backoff
          done
          echo "hab sync failed after 5 attempts" >&2
          exit 1

      - name: Resolve release version
        id: ver
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="${INPUT_TAG#v}"
            if [ -z "$VER" ]; then VER="0.0.0-whisker.dev"; fi
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Build Lynx + PrimJS xcframeworks
        # See .whisker/ios/build-xcframeworks.sh — sets up a carrier
        # Xcode project, pod-installs Lynx via the fork-controlled
        # podspec (path => fork tree), xcodebuilds for iOS device +
        # simulator with `use_frameworks!` (dynamic), then assembles
        # 4 xcframeworks. Lynx's category-method registration relies
        # on dynamic linkage (see the comment in build-xcframeworks.sh).
        #
        # BUILD_DIR is intentionally placed OUTSIDE the fork checkout
        # (`workspace/../lynx-build`, not `workspace/lynx-build`).
        # Otherwise it nests *inside* the fork tree as
        # `/Users/runner/work/lynx/lynx/lynx-build/`, where it sits as
        # a sibling of the fork's existing `build/` directory. With
        # `:path` pointing at the fork tree, CocoaPods 1.16's
        # `private_header_files` enumeration walks `build/build_config.h`
        # successfully *locally* but mysteriously drops it on CI's
        # nested layout — the CpHeader phase for `build_config.h`
        # never gets generated and `LynxBase`'s `unique_fd.cc` then
        # fails to find `#include "build/build_config.h"`. Sibling
        # layout sidesteps the issue.
        run: .whisker/ios/build-xcframeworks.sh
        env:
          BUILD_DIR: ${{ runner.temp }}/lynx-build
          OUT_DIR: ${{ runner.temp }}/lynx-ios

      - name: Stage + pack tarball
        run: .whisker/ios/stage-tarball.sh
        env:
          LYNX_BUILD_OUT: ${{ runner.temp }}/lynx-ios
          VERSION: ${{ steps.ver.outputs.version }}

      - name: Upload artifact (workflow_dispatch)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: whisker-lynx-ios
          path: |
            whisker-lynx-ios-*.tar.gz
            whisker-lynx-ios-*.tar.gz.sha256

      - name: Upload to release (tag push)
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            whisker-lynx-ios-*.tar.gz
            whisker-lynx-ios-*.tar.gz.sha256

      - name: Pack individual xcframework zips + SwiftPM checksums
        # See .whisker/ios/stage-swiftpm.sh — zips each xcframework
        # produced by build-xcframeworks.sh and computes the SwiftPM
        # checksum (`swift package compute-checksum`, NOT raw shasum)
        # that consumers paste into `binaryTarget(url:, checksum:)`.
        run: .whisker/ios/stage-swiftpm.sh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          XCF_DIR: ${{ github.workspace }}/lynx-ios
          OUT_DIR: ${{ github.workspace }}/swiftpm-out

      - name: Upload xcframework zips (workflow_dispatch)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: swiftpm-xcframeworks
          path: swiftpm-out/**

      - name: Upload xcframework zips to release (tag push)
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            swiftpm-out/*.xcframework.zip
            swiftpm-out/*.xcframework.zip.sha256
            swiftpm-out/swiftpm-manifest-*.txt
